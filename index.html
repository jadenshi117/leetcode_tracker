<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeetCode Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Leetcode Tracker</h1>

    <section>
        <h2>Add a Problem</h2>
        <form id= "add_form">
            <input type="text" id="name" placeholder="Problem name" required>
            <select id="pattern"></select>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button type="submit">Add</button>
        </form>
    </section>

    <section>
        <h2>Pattern Stats</h2>
        <ul id="stats_list"></ul>
    </section>

    <button id="reveal_problems">View Saved Problems</button>
    <div id="saved_problems">
        <p>hidden content</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
